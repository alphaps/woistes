replicaCount: 1

image:
  repository: woistes
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  host: ""
  # Ingress controller class. "nginx" for AKS; override to "traefik" for
  # Rancher Desktop / k3s (e.g. --set ingress.className=traefik).
  className: nginx
  tls:
    enabled: true
    secretName: woistes-tls
    clusterIssuer: letsencrypt-prod

sqlserver:
  password: Woistes_Prod_Change_Me!
  storage: 10Gi

auth:
  googleClientId: ""
  googleClientSecret: ""
  allowedEmails: []

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 512Mi
