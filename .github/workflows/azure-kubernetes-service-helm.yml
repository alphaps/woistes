# This workflow will build and push an application to a Azure Kubernetes Service (AKS) cluster when you push your code
#
# This workflow assumes you have already created the target AKS cluster and have created an Azure Container Registry (ACR)
# The ACR should be attached to the AKS cluster
# For instructions see:
#   - https://docs.microsoft.com/en-us/azure/aks/kubernetes-walkthrough-portal
#   - https://docs.microsoft.com/en-us/azure/container-registry/container-registry-get-started-portal
#   - https://learn.microsoft.com/en-us/azure/aks/cluster-container-registry-integration?tabs=azure-cli#configure-acr-integration-for-existing-aks-clusters
#   - https://github.com/Azure/aks-create-action
#
# To configure this workflow:
#
# 1. Set the following secrets in your repository (instructions for getting these
#    https://docs.microsoft.com/en-us/azure/developer/github/connect-from-azure?tabs=azure-cli%2Clinux)):
#    - AZURE_CLIENT_ID
#    - AZURE_TENANT_ID
#    - AZURE_SUBSCRIPTION_ID
#
# 2. Set the following environment variables (or replace the values below):
#    - AZURE_CONTAINER_REGISTRY (name of your container registry / ACR)
#    - CONTAINER_NAME (name of the container image you would like to push up to your ACR)
#    - RESOURCE_GROUP (where your cluster is deployed)
#    - CLUSTER_NAME (name of your AKS cluster)
#    - IMAGE_PULL_SECRET_NAME (name of the ImagePullSecret that will be created to pull your ACR image)
#
# 3. Choose the appropriate render engine for the bake step https://github.com/Azure/k8s-bake. The config below assumes Helm.
#    Set your helmChart, overrideFiles, overrides, and helm-version to suit your configuration.
#    - CHART_PATH (path to your helm chart)
#    - CHART_OVERRIDE_PATH (path to your helm chart with override values)
#
# For more information on GitHub Actions for Azure, refer to https://github.com/Azure/Actions
# For more samples to get started with GitHub Action workflows to deploy to Azure, refer to https://github.com/Azure/actions-workflow-samples
# For more options with the actions used below please refer to https://github.com/Azure/login

name: Build and deploy Woistes to AKS with Helm

on:
  push:
    branches: ["master"]
  workflow_dispatch:

env:
  AZURE_CONTAINER_REGISTRY: "woistesregistry"
  CONTAINER_NAME: "woistes"
  RESOURCE_GROUP: "woistes_group"
  CLUSTER_NAME: "woistes"
  CHART_PATH: "k8s"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Run tests
        run: dotnet test --no-build --verbosity normal

  # Code coverage is informational only: it runs in parallel with `test`, is not
  # in any `needs` chain, and never blocks build/deploy. Coverage instrumentation
  # noticeably slows the parser tests, so it is kept off the gating `test` job.
  #
  # NOTE: the CtfParser tests need the large sample .CTF files, which are NOT in
  # the repo (a deliberate choice — see SPEC). On CI those files are absent, so
  # the parser tests no-op (and `Woistes.CtfParser` reports ~0% here). Parser
  # coverage (~99%) is only meaningful when run locally with sampleCTF/ present.
  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Collect coverage
        run: dotnet test --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./TestResults

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: 'TestResults/**/coverage.cobertura.xml'
          targetdir: 'CoverageReport'
          reporttypes: 'HtmlInline;TextSummary;MarkdownSummaryGithub'

      - name: Add coverage to job summary
        if: always()
        run: cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: CoverageReport

  buildImage:
    needs: [test]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      # Checks out the repository this file is in
      - uses: actions/checkout@v4

      # Logs in with your Azure credentials
      - name: Azure login
        uses: azure/login@v1.4.6
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Builds and pushes an image up to your Azure Container Registry
      # Original (requires ACR Standard/Premium tier for ACR Tasks):
      # - name: Build and push image to ACR
      #   run: |
      #     az acr build --image ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_NAME }}:${{ github.sha }} --registry ${{ env.AZURE_CONTAINER_REGISTRY }} -g ${{ env.RESOURCE_GROUP }} .

      - name: Log in to ACR
        run: az acr login --name ${{ env.AZURE_CONTAINER_REGISTRY }}

      - name: Build and push image to ACR
        run: |
          docker build -t ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_NAME }}:${{ github.sha }} .
          docker push ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_NAME }}:${{ github.sha }}

  deploy:
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    needs: [buildImage]
    steps:
      # Checks out the repository this file is in
      - uses: actions/checkout@v4

      # Logs in with your Azure credentials
      - name: Azure login
        uses: azure/login@v1.4.6
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Use kubelogin to configure your kubeconfig for Azure auth
      - name: Set up kubelogin for non-interactive login
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.0.25'

      # Retrieves your Azure Kubernetes Service cluster's kubeconfig file
      - name: Get K8s context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}
          admin: 'false'
          use-kubelogin: 'true'

      # Deploys application based on Helm chart - could replace the bake and deploy steps below with a direct Helm upgrade/install command, but using the bake and deploy actions allows for more flexibility (e.g. easily swapping out render engines, or adding additional steps between bake and deploy)
      # --atomic auto-rolls-back on a failed deploy, avoiding the stuck-release problem.
      # --timeout ensures the deploy doesn't get stuck indefinitely (e.g. if your probes are misconfigured and your pods never become healthy, the deploy will eventually fail and roll back instead of being stuck in a pending state)
      # 1/ The Azure/k8s-deploy@v4 action does more than apply YAML:
      #  - Built-in blue-green / canary strategies with traffic management (e.g. with Azure Front Door or Application Gateway) and automatic rollback on failure.
      #  - Automatic image-pull-secret handling and resource annotation for change tracking.
      #  - With Helm you get Helm's own --wait --atomic instead, which is good but different.
      # 2/ Helm release state lives in the cluster (as a secret), so if a deploy fails partway through, the release can get stuck in a pending state and block future deploys until you manually intervene with helm rollback or helm uninstall --force. The stateless apply approach with k8s-deploy doesn't have this problem, since it doesn't rely on any in-cluster state to track releases.
      # 3/ A classic Helm pain: an upgrade that times out leaves the release in pending-upgrade status, and the next deploy errors with "another operation is in progress." You then need helm rollback or --force. The stateless apply approach never has this failure mode.
      # 4/ helm upgrade won't restart pods on a latest tag change alone, so we also set the image tag to the git sha to ensure a new image triggers a redeploy
      #
      # - name: Deploy with Helm
      #     run: |
      #       helm upgrade --install woistes ./k8s \
      #         --atomic --timeout 5m \
      #         --set image.repository=${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_NAME }} \
      #         --set image.tag=${{ github.sha }} \
      #         --set auth.googleClientId='${{ secrets.GOOGLE_CLIENT_ID }}' \
      #         --set auth.googleClientSecret='${{ secrets.GOOGLE_CLIENT_SECRET }}' \
      #         --set "auth.allowedEmails={${{ secrets.ALLOWED_EMAILS }}}"
              
      # Runs Helm to create manifest files
      - name: Bake deployment
        uses: azure/k8s-bake@v2
        with:
          renderEngine: "helm"
          helmChart: ${{ env.CHART_PATH }}
          overrides: |
            image.repository:${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_NAME }}
            image.tag:${{ github.sha }}
            auth.googleClientId:${{ secrets.GOOGLE_CLIENT_ID }}
            auth.googleClientSecret:${{ secrets.GOOGLE_CLIENT_SECRET }}
            auth.allowedEmails:{${{ secrets.ALLOWED_EMAILS }}}
          helm-version: "latest"
        id: bake

      # Deploys application based on manifest files from previous step
      - name: Deploy application
        uses: Azure/k8s-deploy@v4
        with:
          action: deploy
          manifests: ${{ steps.bake.outputs.manifestsBundle }}
          images: |
            ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_NAME }}:${{ github.sha }}

      # Remove old images from ACR (keep 5 most recent)
      # Requires ACR Tasks (blocked on some subscriptions):
      # - name: Clean up old ACR images (ACR Tasks)
      #   run: |
      #     az acr run --cmd "acr purge --filter '${{ env.CONTAINER_NAME }}:.*' --ago 7d --untagged --keep 5" --registry ${{ env.AZURE_CONTAINER_REGISTRY }} /dev/null
      - name: Clean up old ACR images
        run: |
          TAGS=$(az acr repository show-tags --name ${{ env.AZURE_CONTAINER_REGISTRY }} --repository ${{ env.CONTAINER_NAME }} --orderby time_desc -o tsv)
          COUNT=0
          for TAG in $TAGS; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt 5 ]; then
              az acr repository delete --name ${{ env.AZURE_CONTAINER_REGISTRY }} --image ${{ env.CONTAINER_NAME }}:$TAG --yes
            fi
          done
